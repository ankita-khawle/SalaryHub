services:
  db:
    image: postgres:17-alpine
    container_name: salaryhub-db
    environment:
      POSTGRES_DB: salaryhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - salaryhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salaryhub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  salaryhub_postgres_data: